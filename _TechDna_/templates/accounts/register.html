{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear cuenta</title>

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>

    <div class="auth-page">

        <section>

            <h1>Crear cuenta</h1>

            <form method="post">

                {% csrf_token %}
                
                {{ form.as_p }}

                <button class="btn btn-primary" type="submit">
                    Registrarse

            </form>

        </section>

    </div>

</body>
</html>
