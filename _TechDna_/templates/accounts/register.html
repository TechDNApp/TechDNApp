{% extends "base.html" %}

{% block title %}Crear cuenta | Tech DNA{% endblock %}

{% block content %}
<section>
    <h1>Crear cuenta</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">
            Registrarse
        </button>
    </form>

    <p>
        ¿Ya tienes una cuenta?
        <a href="{% url 'accounts:login' %}">Iniciar sesión</a>
    </p>
</section>
{% endblock %}
