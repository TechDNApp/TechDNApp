{% extends "base.html" %}

{% block title %}Editar Perfil | Tech DNA{% endblock %}

{% block content %}
<div class="auth-page">
    <section>
        <h2>Editar Perfil Técnico</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="profile-actions">
                <button class="btn btn-primary" type="submit">
                    Guardar Cambios
                </button>
                <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">
                    Cancelar
                </a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
