{% extends "base.html" %}

{% block title %}Iniciar sesión | Tech DNA{% endblock %}

{% block content %}

<div class="auth-page">
    <section>
        <h1>Iniciar sesión</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary" type="submit">
                Acceder
            </button>
        </form>
    </section>
    
</div>

{% endblock %}
