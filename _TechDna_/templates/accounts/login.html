{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
    <div class="auth-page">

        <section>

            <h1>Iniciar sesión</h1>

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-primary" type="submit">
                    Acceder
                </button>

            </form>

        </section>
        
    </div>

</body>
</html>
