{% extends "base.html" %}

{% block content %}
<section class="auth-section">
    <h2>{% if object %}Editar prueba{% else %}Crear prueba{% endif %}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                Guardar
            </button>
            <a href="{% url 'core:home' %}" class="btn btn-secondary">
                Cancelar
            </a>
        </div>
    </form>
</section>
{% endblock %}
